name: Substack akışını güncelle
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/build_feed.py
      - run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || (git commit -m "Substack akışı güncellendi" && git push)
